[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cratebot"
version = "0.1.0"
description = "Discord bot that watches channels for music links and files them into a nominated Spotify playlist."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "cryptography>=42",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
cratebot = "cratebot.main:run"
cratebot-auth = "cratebot.spotify.auth:cli_setup"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
