services:
  cratebot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Bind-mount the host's real ./data so the container uses the same
      # database the host process (`cratebot`/`cratebot-auth`) already
      # authorised and populated - a named volume would start empty.
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
