services:
  cratebot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - cratebot_data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cratebot_data:
